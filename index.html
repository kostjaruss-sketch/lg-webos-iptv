<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine IPTV Videothek</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 28px 40px;
      background: #191e2b;
      border-bottom: 2px solid #343b50;
    }
    h1 { margin: 0; color: #64d8ff; }
    nav { padding: 20px 40px; }
    button {
      background: #252c3d;
      color: white;
      border: 2px solid #46516a;
      border-radius: 8px;
      padding: 15px 25px;
      margin-right: 12px;
      font-size: 20px;
      cursor: pointer;
    }
    button:focus {
      outline: 3px solid #64d8ff;
      background: #087ca7;
    }
    main { padding: 10px 40px; }
    .panel {
      background: #191e2b;
      border-radius: 12px;
      padding: 25px;
      min-height: 220px;
    }
    h2 { color: #64d8ff; }
    p { font-size: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>MEINE IPTV VIDEOTHEK</h1>
    <p>Live-TV · Filme · Serien</p>
  </header>

  <nav>
    <button onclick="showPage('tv')">Live-TV</button>
    <button onclick="showPage('movies')">Filme</button>
    <button onclick="showPage('series')">Serien</button>
  </nav>

  
  <main>
    
<section class="panel">
  <h2>Meine Playlists</h2>

  <p>Live-TV – M3U-Link</p>
  <input id="tvUrl" type="url" placeholder="M3U-Link für Live-TV">

  <p>Filme – M3U-Link</p>
  <input id="moviesUrl" type="url" placeholder="M3U-Link für Filme">

  <p>Serien – M3U-Link</p>
  <input id="seriesUrl" type="url" placeholder="M3U-Link für Serien">

  <button onclick="savePlaylists()">Playlists speichern</button>
  <p id="playlistStatus">Noch keine Playlists gespeichert.</p>
</section>

    <section class="panel">
      <h2 id="title">Willkommen!</h2>
      <p id="description">
        Wähle oben Live-TV, Filme oder Serien.
      </p>
    </section>
  </main>

  <script>
    function showPage(page) {
      const pages = {
        tv: {
          title: 'Live-TV',
          description: 'Hier werden später deine TV-Sender angezeigt.'
        },
        movies: {
          title: 'Filme',
          description: 'Hier entsteht deine Filmbibliothek.'
        },
        series: {
          title: 'Serien',
          description: 'Hier entsteht deine Serienbibliothek.'
        }
      };

      document.getElementById('title').textContent =
        pages[page].title;
      document.getElementById('description').textContent =
        pages[page].description;
    }
    
  async function loadPlaylist() {
  const url = document.getElementById('playlistUrl').value.trim();

  if (!url) {
    alert('Bitte zuerst den M3U-Link eingeben.');
    return;
  }

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('Playlist konnte nicht geladen werden.');
    }

    const text = await response.text();

    if (!text.startsWith('#EXTM3U')) {
      throw new Error('Das ist keine gültige M3U-Playlist.');
    }

    alert('Playlist erfolgreich geladen!');
    document.getElementById('title').textContent = 'Playlist geladen';
    document.getElementById('description').textContent =
      'Die Playlist wurde gelesen. Als Nächstes zeigen wir die Sender und Filme an.';
  } catch (error) {
    alert('Fehler beim Laden: ' + error.message +
      '\nDer Anbieter muss den Zugriff aus dem Browser erlauben.');
  }
}
  function savePlaylists() {
  const playlists = {
    tv: document.getElementById('tvUrl').value.trim(),
    movies: document.getElementById('moviesUrl').value.trim(),
    series: document.getElementById('seriesUrl').value.trim()
  };

  localStorage.setItem('myIPTVPlaylists', JSON.stringify(playlists));

  document.getElementById('playlistStatus').textContent =
    'Playlists wurden in diesem Browser gespeichert.';
}

function loadSavedPlaylists() {
  const saved = localStorage.getItem('myIPTVPlaylists');
  if (!saved) return;

  const playlists = JSON.parse(saved);
  document.getElementById('tvUrl').value = playlists.tv || '';
  document.getElementById('moviesUrl').value = playlists.movies || '';
  document.getElementById('seriesUrl').value = playlists.series || '';
}

window.addEventListener('DOMContentLoaded', loadSavedPlaylists);
  </script>
   
<script>
async function ladePlaylist(url, bereich) {
  const ausgabe = document.getElementById('playlistAusgabe');
  ausgabe.innerHTML = 'Playlist wird geladen …';

  try {
    const antwort = await fetch(url);
    if (!antwort.ok) throw new Error('HTTP ' + antwort.status);

    const text = await antwort.text();
    if (!text.trim().startsWith('#EXTM3U')) {
      throw new Error('Keine gültige M3U-Playlist');
    }

    const zeilen = text.split(/\r?\n/);
    const sender = [];

    for (let i = 0; i < zeilen.length; i++) {
      if (zeilen[i].startsWith('#EXTINF:')) {
        const titel = zeilen[i].split(',').pop().trim();
        const link = zeilen.slice(i + 1).find(z => z.trim() && !z.startsWith('#'));

        if (link) sender.push({ titel, link: link.trim() });
      }
    }

    ausgabe.innerHTML = '';
    if (!sender.length) {
      ausgabe.textContent = 'Keine Einträge gefunden.';
      return;
    }

    sender.forEach(eintrag => {
      const knopf = document.createElement('button');
      knopf.textContent = eintrag.titel;
      knopf.style.display = 'block';
      knopf.style.margin = '8px';
      knopf.onclick = () => {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.style.width = '100%';
        video.src = eintrag.link;
        ausgabe.replaceChildren(video);
      };
      ausgabe.appendChild(knopf);
    });
  } catch (fehler) {
    ausgabe.textContent =
      'Fehler beim Laden: ' + fehler.message +
      '. Der Anbieter muss eventuell Browserzugriff erlauben.';
  }
}
</script>

</body>
</html>
